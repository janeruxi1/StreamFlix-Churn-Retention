name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Skip heavy deps (shap/lifelines/streamlit) -- not needed for the
          # test suite; they're covered by the notebooks locally.
          pip install pandas numpy scipy scikit-learn xgboost pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short
